# XcodeGen project definition. Generate the Xcode project with:
#   brew install xcodegen
#   npm run ios:export          (copies the offline map data into OpenSkiPlanner/Offline)
#   cd ios && xcodegen generate
#   open OpenSkiPlanner.xcodeproj
name: OpenSkiPlanner
options:
  bundleIdPrefix: local.openskimap
  deploymentTarget:
    iOS: "17.0"
packages:
  SkiCore:
    path: Packages/SkiCore
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.10.0
targets:
  OpenSkiPlanner:
    type: application
    platform: iOS
    sources:
      - path: OpenSkiPlanner
        excludes:
          - Offline/**
      - path: OpenSkiPlanner/Offline
        type: folder
        optional: true
    dependencies:
      - package: SkiCore
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.openskimap.planner
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Shows where you are on the ski map."
