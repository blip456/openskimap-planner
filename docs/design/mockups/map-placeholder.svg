<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" preserveAspectRatio="xMidYMid slice">
  <!-- Static placeholder map for the mockups: terrain, forest, contours, runs, a lift and a planned route. -->
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3d3527" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="400" height="860" fill="#e7e3da"/>
  <!-- hillshade ridges -->
  <g filter="url(#soft)" fill="#6b6255" opacity="0.32">
    <path d="M-40 120 C 80 80, 160 220, 260 170 S 420 120, 460 200 L 460 260 C 380 230, 300 300, 200 270 S 20 210, -40 260Z"/>
    <path d="M-40 520 C 60 470, 140 560, 230 520 S 380 430, 460 480 L 460 540 C 360 520, 300 600, 200 590 S 40 560, -40 600Z"/>
    <path d="M120 320 C 170 380, 160 440, 110 520 L 80 510 C 120 440, 120 380, 90 330Z"/>
  </g>
  <g filter="url(#soft)" fill="#ffffff" opacity="0.55">
    <path d="M-40 60 C 60 30, 160 150, 250 120 S 400 60, 460 120 L 460 150 C 380 120, 300 190, 200 180 S 20 120, -40 150Z"/>
    <path d="M-40 440 C 60 400, 150 480, 240 450 S 380 380, 460 420 L 460 450 C 360 440, 300 500, 200 500 S 40 470, -40 500Z"/>
  </g>
  <!-- forest -->
  <g fill="#9cc98f" opacity="0.55">
    <path d="M10 600 C 60 560, 120 590, 150 640 C 170 690, 120 760, 60 770 C 10 760, -10 700, 10 600Z"/>
    <path d="M250 640 C 300 610, 370 640, 390 700 C 400 760, 340 820, 280 800 C 240 770, 220 690, 250 640Z"/>
    <path d="M280 300 C 320 280, 380 300, 400 340 L 400 420 C 360 430, 300 400, 280 360Z"/>
    <path d="M0 300 C 30 290, 60 320, 50 360 C 40 390, 10 400, 0 390Z"/>
  </g>
  <!-- lake -->
  <path d="M330 560 C 350 548, 372 556, 372 576 C 372 600, 344 606, 332 592 C 322 580, 322 566, 330 560Z" fill="#9fd3ec"/>
  <!-- contours -->
  <g fill="none" stroke="#a0784a" stroke-width="0.6" opacity="0.45">
    <path d="M-10 90 C 90 60, 170 190, 260 150 S 400 100, 410 140"/>
    <path d="M-10 130 C 90 100, 170 230, 260 190 S 400 140, 410 180"/>
    <path d="M-10 170 C 90 140, 170 270, 260 230 S 400 180, 410 220"/>
    <path d="M-10 215 C 90 185, 170 310, 260 275 S 400 225, 410 265"/>
    <path d="M-10 260 C 90 235, 170 350, 260 320 S 400 270, 410 310"/>
    <path d="M-10 310 C 90 290, 170 395, 260 370 S 400 320, 410 360"/>
    <path d="M-10 365 C 90 350, 170 440, 260 420 S 400 375, 410 410"/>
    <path d="M-10 420 C 90 410, 170 490, 260 470 S 400 430, 410 460"/>
    <path d="M-10 480 C 90 470, 170 540, 260 525 S 400 485, 410 515"/>
    <path d="M-10 545 C 90 535, 170 600, 260 585 S 400 545, 410 575"/>
    <path d="M-10 610 C 90 600, 170 660, 260 650 S 400 615, 410 640"/>
    <path d="M-10 680 C 90 670, 170 725, 260 715 S 400 685, 410 705"/>
    <path d="M-10 750 C 90 742, 170 790, 260 782 S 400 755, 410 775"/>
  </g>
  <!-- other runs (white casing + colour) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 150 C 60 260, 120 330, 90 430 S 60 560, 110 640" stroke="#fff" stroke-width="6"/>
    <path d="M70 150 C 60 260, 120 330, 90 430 S 60 560, 110 640" stroke="#1f6fd6" stroke-width="3"/>
    <path d="M330 170 C 350 260, 300 330, 330 420 S 360 520, 320 620" stroke="#fff" stroke-width="6"/>
    <path d="M330 170 C 350 260, 300 330, 330 420 S 360 520, 320 620" stroke="#111" stroke-width="3"/>
    <path d="M150 420 C 190 470, 160 520, 200 560" stroke="#fff" stroke-width="6"/>
    <path d="M150 420 C 190 470, 160 520, 200 560" stroke="#2e9d3a" stroke-width="3"/>
    <path d="M360 640 C 330 700, 360 760, 340 840" stroke="#fff" stroke-width="6"/>
    <path d="M360 640 C 330 700, 360 760, 340 840" stroke="#d8251d" stroke-width="3"/>
  </g>
  <!-- lift -->
  <g>
    <line x1="230" y1="700" x2="150" y2="250" stroke="#7b1fa2" stroke-width="2"/>
    <circle cx="230" cy="700" r="4.5" fill="#fff" stroke="#7b1fa2" stroke-width="2"/>
    <circle cx="150" cy="250" r="4.5" fill="#fff" stroke="#7b1fa2" stroke-width="2"/>
    <text x="160" y="380" transform="rotate(80 160 380)" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#7b1fa2" stroke="#fff" stroke-width="2.2" paint-order="stroke">Nebelhornbahn</text>
  </g>
  <!-- planned route: red run down from the top station, then the lift section -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 250 C 210 290, 240 320, 225 360 S 200 430, 260 470 S 300 560, 262 640" stroke="#fff" stroke-width="11"/>
    <path d="M150 250 C 210 290, 240 320, 225 360 S 200 430, 260 470 S 300 560, 262 640" stroke="#1f6fd6" stroke-width="6"/>
    <path d="M150 250 C 210 290, 240 320, 225 360 S 200 430, 260 470" stroke="#d8251d" stroke-width="6"/>
    
  </g>
  <!-- labels -->
  <g font-family="system-ui, sans-serif" fill="#333" stroke="#fff" stroke-width="2.4" paint-order="stroke">
    <text x="96" y="232" font-size="11.5" font-weight="600">Nebelhorn 2224 m</text>
    <text x="268" y="300" font-size="10.5">Höfatsblick</text>
    <text x="24" y="560" font-size="10.5">Seealpe</text>
    <text x="300" y="545" font-size="9.5" fill="#2a6f99">Seealpsee</text>
  </g>
  <rect width="400" height="860" fill="url(#shade)"/>
</svg>
